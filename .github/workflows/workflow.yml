name: Deploy Static Site

on:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Generate new host
      id: generate
      run: ~/.nvm/versions/node/v24.15.0/bin/node ~/scripts/generate-host.js "${{ github.event.repository.name }}"

    - name: Build and run container
      env:
        NAME: "${{ steps.generate.outputs.name }}"
        PORT: "${{ steps.generate.outputs.port }}"
      run: |
        docker build -t "${NAME}-image:latest" .

        docker stop "${NAME}-container" 2>/dev/null || true
        docker rm "${NAME}-container" 2>/dev/null || true

        docker run -d \
          --name "${NAME}-container" \
          -p "127.0.0.1:${PORT}:80" \
          --restart unless-stopped \
          "${NAME}-image:latest"

    - name: Enable sites and reload Apache
      run: |
        a2ensite *.conf
        apachectl restart




